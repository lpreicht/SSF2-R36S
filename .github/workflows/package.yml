name: Build test installer
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch and verify R36S ARM64 Ruffle binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            --output ssf2-r36s/rufflesa \
            https://raw.githubusercontent.com/Cristiangc67/ruffle-r36s-darkos/main/ruffleEngine/rufflesa
          # Pin to the exact upstream Git blob that was inspected when the project was created.
          test "$(git hash-object ssf2-r36s/rufflesa)" = "f954e372d24c11d984fa1c0a596e39eaed6ad3a8" || {
            echo "Upstream Ruffle runtime changed: review binary before using it." >&2
            exit 1
          }
          file ssf2-r36s/rufflesa
          readelf -h ssf2-r36s/rufflesa | grep -q AArch64 || {
            echo "Not a Linux ARM64 executable." >&2
            exit 1
          }
          # The upstream ARM binary hardcodes /usr/local/bin/console_detect.
          # Replace exactly 29 bytes with a relative path to our local shim.
          # No /usr/local/bin changes and no root remount needed on the device.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ssf2-r36s/rufflesa")
          data = p.read_bytes()
          before = b"/usr/local/bin/console_detect"
          after  = b"./bin//////////console_detect"
          assert len(before) == len(after) == 29
          assert data.count(before) == 1, "Upstream binary layout changed; must review before patch"
          p.write_bytes(data.replace(before, after))
          assert p.stat().st_size == len(data)
          print("Patched Ruffle console_detect path, original binary length preserved.")
          PY
          # Verify the patch remains the expected ELF architecture.
          readelf -h ssf2-r36s/rufflesa | grep -q AArch64
          chmod +x 'Super Smash Flash 2.sh' ssf2-r36s/rufflesa
      - name: Create SD-card installer ZIP
        shell: bash
        run: |
          set -euo pipefail
          bash -n 'Super Smash Flash 2.sh'
          sh -n ssf2-r36s/bin/console_detect
          mkdir -p dist/ssf2-r36s/game
          cp 'Super Smash Flash 2.sh' dist/
          cp ssf2-r36s/rufflesa dist/ssf2-r36s/
          cp -R ssf2-r36s/keymap dist/ssf2-r36s/
          cp -R ssf2-r36s/bin dist/ssf2-r36s/
          chmod +x dist/ssf2-r36s/bin/console_detect
          cp ssf2-r36s/game/PUT_GAME_FILES_HERE.txt dist/ssf2-r36s/game/
          (cd dist && zip -r -q ../SSF2-R36S-test.zip .)
      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: SSF2-R36S-test
          path: SSF2-R36S-test.zip
          if-no-files-found: error
